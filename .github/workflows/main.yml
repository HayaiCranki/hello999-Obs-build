name: Build OBS Studio (vantisCorp Fork)

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Setup MSVC Developer Command Prompt
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      - name: Download and Setup Dependencies
        shell: powershell
        run: |
          .\CI\build-windows.ps1 -SkipBuild -Choco

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -B build_x64 -G "Visual Studio 17 2022" -A x64 `
                -DCMAKE_SYSTEM_VERSION="10.0" `
                -DQTDIR="${{ github.workspace }}\.deps\Qt6" `
                -DDepsPath="${{ github.workspace }}\.deps"

      - name: Build OBS Studio
        shell: pwsh
        run: |
          cmake --build build_x64 --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Studio-Windows-x64
          path: ${{ github.workspace }}\build_x64\rundir\Release
